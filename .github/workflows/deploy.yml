name: Deploy to Namecheap via FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 21
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: /public_html/
          # 2026-08-25: the previous state file (.ftp-deploy-sync-state.json) got
          # written as if a deploy succeeded when the real file upload silently
          # didn't land — every run since then trusted that stale record and
          # skipped re-uploading. Renaming forces one full fresh re-sync of the
          # files this workflow manages (nothing outside that set is touched).
          #
          # 2026-08-26: same symptom recurred on v3 — run #9 reported success
          # (all steps green) but index.html/services.html on the live site
          # still didn't match main. Bumping to v4 to force another full
          # fresh re-sync rather than trusting the incremental diff.
          state-name: .ftp-deploy-sync-state-v4.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/README.md
