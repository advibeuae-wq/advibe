name: Deploy to Namecheap via FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 21
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          # 2026-08-26: marker-file probe (checked directly over HTTP) ruled
          # out both /public_html/ and /public_html/advibeagency.me/ — the
          # Action's own diff log shows uploads landing at each, byte-
          # identical to local, but the live domain 404s on a file that only
          # exists there. Trying "/" next: this FTP account is very likely
          # already chrooted/jailed to its own docroot on login, in which
          # case an absolute path re-specifying that same docroot nests one
          # level too deep. Will re-run the same marker-file probe here too.
          server-dir: /
          # 2026-08-25: the previous state file (.ftp-deploy-sync-state.json) got
          # written as if a deploy succeeded when the real file upload silently
          # didn't land — every run since then trusted that stale record and
          # skipped re-uploading. Renaming forces one full fresh re-sync of the
          # files this workflow manages (nothing outside that set is touched).
          #
          # 2026-08-26: same symptom recurred on v3 — run #9 reported success
          # (all steps green) but index.html/services.html on the live site
          # still didn't match main. Bumping through v4/v5/v6 as server-dir
          # changes too — each server-dir gets its own state file so a stale
          # state from one path can never mask a missing upload on another.
          state-name: .ftp-deploy-sync-state-v6.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/README.md
