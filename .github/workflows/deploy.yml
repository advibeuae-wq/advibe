name: Deploy to Namecheap via FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 21
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          # 2026-08-26: CONFIRMED via a uniquely-named marker file, checked
          # directly over HTTP after each candidate path — "/" is the FTP
          # account's real docroot. Both /public_html/ and
          # /public_html/advibeagency.me/ accepted uploads (the Action's own
          # diff log showed them landing byte-identical to local) but never
          # appeared live; the account is chrooted/jailed to its docroot on
          # login, so those absolute paths nested one level too deep inside
          # the jail. Do not change this without re-running that probe.
          server-dir: /
          state-name: .ftp-deploy-sync-state-v6.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/README.md
