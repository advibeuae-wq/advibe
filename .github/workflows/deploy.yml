name: Deploy to Namecheap via FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 21
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          # 2026-08-25: advibeagency.me is an addon domain on this hosting
          # account, so its real document root is the subfolder below — NOT
          # /public_html/ itself (that's the account's primary/default
          # docroot, a different, unrelated site). Every prior run of this
          # workflow deployed to the wrong directory as a result; confirmed
          # via cPanel > Domains that this is the correct document root.
          server-dir: /public_html/advibeagency.me/
          # 2026-08-25: the previous state file (.ftp-deploy-sync-state.json) got
          # written as if a deploy succeeded when the real file upload silently
          # didn't land — every run since then trusted that stale record and
          # skipped re-uploading. Renaming forces one full fresh re-sync of the
          # files this workflow manages (nothing outside that set is touched).
          state-name: .ftp-deploy-sync-state-v2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/README.md
