<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advibe CMS — Sign in</title>
<style>
  :root {
    --bg: #0A0A0A; --bg-elevated: #141414; --border: rgba(255,255,255,.08);
    --text: #F2EFEA; --text-muted: #A8A29A; --gold-400: #DDAE5C; --gold-300: #F0CE84;
    --negative: #E8998C;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, "Segoe UI", sans-serif;
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 100%; max-width: 360px; margin: 24px;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 12px; padding: 32px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--text-muted); font-size: 14px; margin: 0 0 24px; }
  label { display: block; font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 12px 14px; font: inherit;
  }
  input:focus { outline: 2px solid var(--gold-400); outline-offset: 1px; }
  button {
    margin-top: 20px; width: 100%;
    background: linear-gradient(90deg, #B0813A, var(--gold-300));
    border: none; color: #201200; font-weight: 700; padding: 13px; border-radius: 999px;
    font-size: 15px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .error {
    background: rgba(232,153,140,.12); border: 1px solid var(--negative); color: var(--negative);
    padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Advibe CMS</h1>
    <p class="sub">Sign in to publish to the blog.</p>
    <p class="error" id="error"></p>
    <form id="login-form">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit" id="submit-btn">Sign in</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.getElementById("password").value }),
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = "/editor";
        } else {
          errorEl.textContent = data.error || "Sign in failed.";
          errorEl.style.display = "block";
        }
      } catch {
        errorEl.textContent = "Network error — please try again.";
        errorEl.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
